[package]
edition      = "2024"
name         = "esp32-pixelcast"
rust-version = "1.95"
version      = "0.1.0"
license      = "GPL-3.0-or-later"
description  = "Art-Net and sACN to LED firmware for the ESP32 with a W5500"

[[bin]]
name = "esp32-pixelcast"
path = "./src/bin/main.rs"

[dependencies]
heapless               = { version = "0.9", default-features = false }
esp-hal = { version = "~1.2.2", features = ["esp32", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32", "log-04", "unstable", "wifi"] }
esp-storage = { version = "0.10", features = ["esp32"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32",
  "println",
  "custom-halt",
] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }

critical-section = "1.2.0"
pixelcast-core = { path = "core" }
xtensa-lx = "0.13"
static_cell      = "2.1.1"
embassy-net = { version = "0.9", features = ["dhcpv4", "medium-ethernet", "udp", "tcp", "raw", "proto-ipv4", "multicast", "log"] }
embassy-net-wiznet = "0.3"
# Only to switch on smoltcp's ping replies (embassy-net does not expose it).
smoltcp = { version = "0.13", default-features = false, features = ["auto-icmp-echo-reply"] }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embassy-futures = "0.1"
embedded-graphics = "0.8"
embassy-sync = "0.8"
edge-dhcp = { version = "0.8", default-features = false, features = ["io", "log"] }
edge-captive = { version = "0.8", default-features = false, features = ["io", "log"] }
edge-nal = "0.7"
edge-nal-embassy = { version = "0.9", default-features = false, features = ["proto-ipv4", "medium-ethernet", "udp"] }
sha2 = { version = "0.10", default-features = false }


# Web pages are inlined, minified and gzipped at build time (see build.rs).
[build-dependencies]
minify-html = "0.18"
# Zopfli: plain gzip that every browser reads (brotli and zstd are offered
# by browsers only over HTTPS), packed ~5 % smaller than zlib's best.
zopfli = { version = "0.8", default-features = false, features = ["gzip", "std"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
